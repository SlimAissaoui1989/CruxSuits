name: Build

on:
  push:
    branches: [main, microservices]
  pull_request:
    branches: [main, microservices]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore CruxSuits.slnx

      - name: Build
        run: dotnet build CruxSuits.slnx --configuration Release --no-restore

      - name: Start SQL Server for integration and BDD tests
        env:
          FILES_TEST_SQL_PASSWORD: ${{ secrets.FILES_TEST_SQL_PASSWORD || 'CruxSuits_Local_Only!2026' }}
        run: docker compose -f compose.files-integration.yaml up -d --wait

      - name: Run ReferenceDatas unit tests
        run: >-
          dotnet test CruxSuits.Services.Tests.ReferenceDatas.UnitTests/CruxSuits.Services.Tests.ReferenceDatas.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName!~CountryProfileTests"
          --logger "trx;LogFileName=referencedatas-unit-tests.trx"

      - name: Run ReferenceDatas integration tests
        run: >-
          dotnet test CruxSuits.Services.Tests.ReferenceDatas.IntegrationTests/CruxSuits.Services.Tests.ReferenceDatas.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=referencedatas-integration-tests.trx"

      - name: Run ReferenceDatas BDD tests
        env:
          ConnectionStrings__DefaultConnection: Server=localhost,14333;Initial Catalog=ReferenceDataBddTests;User Id=sa;Password=${{ secrets.FILES_TEST_SQL_PASSWORD || 'CruxSuits_Local_Only!2026' }};Encrypt=False;TrustServerCertificate=True
        run: >-
          dotnet test CruxSuits.Services.Tests.ReferenceDatas.BddTests/CruxSuits.Services.Tests.ReferenceDatas.BddTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=referencedatas-bdd-tests.trx"

      - name: Run Files unit tests
        run: >-
          dotnet test CruxSuits.Services.Tests.Files.UnitTests/CruxSuits.Services.Tests.Files.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=files-unit-tests.trx"

      - name: Run Files integration tests
        run: >-
          dotnet test CruxSuits.Services.Tests.Files.IntegrationTests/CruxSuits.Services.Tests.Files.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --settings files.docker.runsettings
          --logger "trx;LogFileName=files-integration-tests.trx"

      - name: Run Files BDD tests
        run: >-
          dotnet test CruxSuits.Services.Tests.Files.BddTests/CruxSuits.Services.Tests.Files.BddTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --settings files.docker.runsettings
          --logger "trx;LogFileName=files-bdd-tests.trx"
