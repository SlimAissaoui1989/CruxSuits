name: Build

on:
  push:
    branches: [main, microservices]
  pull_request:
    branches: [main, microservices]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CruxSuits.slnx

      - name: Build
        run: dotnet build CruxSuits.slnx --configuration Release --no-restore
